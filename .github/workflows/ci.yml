name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v
