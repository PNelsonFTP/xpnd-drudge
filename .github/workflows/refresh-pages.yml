name: Refresh static site and deploy Pages

on:
  schedule:
    # Hourly at :10 UTC — same pattern as AI/Cyber Drudge.
    - cron: "10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/**"
      - "scripts/build_static_data.py"
      - "scripts/update_holdings.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/refresh-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-pages-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Sync holdings from First Trust
        continue-on-error: true
        run: |
          python scripts/update_holdings.py
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def load_head_meta() -> dict:
              try:
                  raw = subprocess.check_output(
                      ["git", "show", "HEAD:data/holdings_meta.json"],
                      text=True,
                  )
                  return json.loads(raw)
              except Exception:
                  return {}

          meta_path = Path("data/holdings_meta.json")
          if not meta_path.exists():
              print("No holdings meta written; not staging holdings files.")
              raise SystemExit(0)
          meta = json.loads(meta_path.read_text())
          old = load_head_meta()
          changed = (
              not old
              or bool(meta.get("rebalanceDetected"))
              or meta.get("asOf") != old.get("asOf")
              or set(meta.get("added") or [])
              or set(meta.get("removed") or [])
          )
          if changed:
              subprocess.check_call(
                  ["git", "add", "data/holdings.csv", "data/holdings_meta.json"]
              )
              print("Staged holdings CSV/meta (membership or as-of changed).")
          else:
              print("Weight-only drift; using fresh CSV for this build, not committing it.")
          PY

      - name: Build static snapshot
        run: python scripts/build_static_data.py --base-path /xpnd-drudge/

      - name: Quality gate
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          def fail(msg: str) -> None:
              print(f"FAIL: {msg}", file=sys.stderr)
              sys.exit(1)

          p = Path("site/data/dashboard.json")
          if not p.exists():
              fail("missing dashboard.json")
          data = json.loads(p.read_text())
          if data.get("mode") != "static":
              fail(f"mode={data.get('mode')!r}, expected 'static'")
          for path in (
              Path("site/index.html"),
              Path("site/static/app.js"),
              Path("site/data/alerts.csv"),
              Path("data/holdings.csv"),
          ):
              if not path.exists():
                  fail(f"missing {path}")

          company_count = int(data.get("company_count") or 0)
          headline_count = int(data.get("headline_count") or 0)
          if company_count < 40 or company_count > 60:
              fail(f"company_count={company_count} not in 40–60")
          if headline_count < 100:
              fail(f"headline_count={headline_count} < 100")

          coverage = data.get("coverage") or {}
          missing_n = 0
          if coverage:
              quote_coverage = coverage.get("quoteCoverage")
              if quote_coverage is not None and float(quote_coverage) < 0.80:
                  fail(f"quoteCoverage={quote_coverage} < 0.80")
              missing = coverage.get("missingNews") or []
              missing_n = (
                  len(missing) if isinstance(missing, list) else int(missing or 0)
              )
              if (
                  missing_n > 10
                  and company_count
                  and missing_n / company_count > 0.20
              ):
                  fail(
                      f"missingNews={missing_n} "
                      f"({missing_n / company_count:.0%} of {company_count})"
                  )

          sync = data.get("holdingsSync") or {}
          meta = {}
          meta_path = Path("site/data/meta.json")
          if meta_path.exists():
              meta = json.loads(meta_path.read_text())
          holdings_as_of = sync.get("asOf") or meta.get("holdingsAsOf")
          if not holdings_as_of:
              print("WARN: holdingsAsOf missing from holdingsSync.asOf and meta")
              if company_count < 40:
                  fail("holdingsAsOf missing and company_count < 40")

          if sync.get("rebalanceDetected"):
              print(
                  "NOTE: reconstitution flagged — "
                  f"added={sync.get('added')} removed={sync.get('removed')}"
              )
          extra = ""
          if coverage:
              extra = (
                  f", quoteCoverage={coverage.get('quoteCoverage')} "
                  f"missingNews={missing_n}"
              )
          print(
              f"OK: {company_count} companies, "
              f"{headline_count} headlines, "
              f"{data.get('negative_total')} negative"
              f"{extra}"
          )
          PY

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain site/ data/holdings.csv data/holdings_meta.json)" ]]; then
            git add site/ data/holdings.csv data/holdings_meta.json
            git commit -m "chore(data): refresh static snapshot $(date -u +%FT%TZ)"
            git push
          else
            echo "No site/ or holdings changes to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
